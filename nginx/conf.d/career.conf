server {
    listen 80;
    server_name career.sandbox.seogyoung.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # career-log 는 세션 쿠키에 Secure 플래그를 붙인다. 이 헤더가 없으면
        # 앱이 요청을 HTTP 로 인식해 쿠키를 설정하지 못하고 로그인이 유지되지 않는다.
        # (certbot --nginx 가 이 location 을 443 블록으로 옮길 때 함께 복사된다.)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 443(HTTPS) 블록은 ssl_setup.sh 의 certbot --nginx 가 자동으로 추가한다.
    # repo 에는 80 블록만 둔다 — 인증서가 없는 새 머신에서도 nginx -t 가 통과해
    # 부트스트랩(HTTP-01 챌린지 → 인증서 발급 → 443 추가)이 가능하도록.
}
